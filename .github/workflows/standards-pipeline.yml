#
# Standards pipeline — DRY-RUN WAVE caller. This is a deliberate OBSERVATION,
# not an adoption, and it is expected to be informative whether it is green or
# red.
#
# `.machine_readable/pipeline-allow.txt` in hyperpolymath/standards is seeded
# EMPTY by doctrine. Its own text: "An entry here must be EARNED BY
# OBSERVATION: the pipeline ran in that repository and went red. It must never
# be seeded by inference." and "The honest seed is a dry-run wave: adopt the
# caller in a deliberate sample, record the real verdict per repository, and add
# only what actually went red." This caller is how that observation is earned.
#
# ⚠ KNOWN DEFECT DISCLOSED: hyperpolymath/standards#976 — ci-pipeline.yml's
# `detect` job counts `*.ncl` into its ecosystem denominator, and the RSR
# template ships a six-file k9 Nickel set into every seeded repository, so
# TOTAL can be lifted above zero by boilerplate alone and the zero-denominator
# refusal is then never reached. This repository was chosen BECAUSE its verdict
# does not depend on that contaminated signal.
#
# Pinned to an immutable commit, never `@main`: following main would let one
# push in standards change the verdict of every already-pinned caller with no
# review here.
name: "🟡 CHECK: Standards pipeline"

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    # hyperpolymath/standards @ 2eb9bb19 — ci-pipeline.yml blob d2583657.
    #
    # NO `secrets:` block, deliberately. ci-pipeline.yml declares
    # `workflow_call.inputs` only, has no `secrets:` block and references no
    # `secrets.*` anywhere; `secrets: inherit` would hand the whole store to a
    # workflow that consumes none of it.
    uses: hyperpolymath/standards/.github/workflows/ci-pipeline.yml@1ded685afb366dededa9f372f82fb58cd45f3c7b
    with:
      # ── Why this repository sets fail_on_no_ecosystem: false ──────────────
      # This repository tracks NO code: AsciiDoc, licence texts, governance
      # prose, `.github/` and `mise.toml`. The pipeline's ecosystem probe
      # (Cargo.toml, *.ncl, rescript.json/bsconfig.json/*.res, v.mod,
      # *.cabal/stack.yaml/*.hs, deno.json(c)) therefore matches zero tracked
      # files, and `detect` refuses to report success on a zero denominator —
      # by design, because every lint/format gate behind it would be vacuous:
      #
      #     No known ecosystem detected (denominator = 0). Every lint and format
      #     gate would be vacuous, so this pipeline refuses to report success.
      #
      # That refusal names its own escape hatch, and this is it: "Add the
      # ecosystem's marker file, or call this workflow with
      # fail_on_no_ecosystem: false and say why." There is no ecosystem marker
      # to add that would not be an invention (a `package.json` or a `Cargo.toml`
      # planted to lift the denominator is exactly the vacuous gate the refusal
      # exists to prevent), so the honest switch is the second one.
      #
      # What this does NOT do: claim a pass. With the probe disabled `detect`
      # prints `::warning::… continuing with nothing checked`, and the report
      # job still tabulates every gate as `skipped` under its own line, "A
      # skipped gate examined nothing. It is not a pass." The secret scan —
      # deliberately NOT gated on `detect` — still runs and still gates.
      #
      # It is deliberately NOT an entry in `.machine_readable/pipeline-allow.txt`:
      # that ledger is shrink-only and is seeded ONLY from repositories whose
      # gates really FAILED, earned by observation (standards#1108 §2). Nothing
      # here failed; there is nothing to grandfather.
      fail_on_no_ecosystem: false
