#
# Hypatia Neurosymbolic CI/CD Security Scan — CANONICAL CALLER.
#
# This file used to carry a 416-line INLINE copy of the scan (build Hypatia from
# source, convert findings to SARIF with an embedded Node script, upload, report,
# comment). That copy had drifted 424 diff lines away from upstream and, among
# other things, hard-failed at "Upload SARIF to GitHub code scanning" on this
# repository: it is PRIVATE, so it has no code-scanning surface, and the upload
# was not tolerated. hyperpolymath/info#16.
#
# The estate's canonical scan now lives in a reusable workflow, and it already
# answers exactly that failure mode: its upload step is `continue-on-error: true`
# with the reason written next to it — "This flag only tolerates a genuine upload
# failure (e.g. Advanced Security disabled on a private repo) once the job is
# actually running" — while the scanner build, the findings artifact, the step
# summary and the (advisory-until-a-baseline-lands) gate all still run.
#
# So this file delegates instead of re-implementing (the same ruling that makes
# Rust CI call rust-ci-reusable.yml rather than a second copy). Reporting,
# scanning and gating behaviour all come from the pinned reusable; nothing here
# decides anything.
#
# Pin: hyperpolymath/standards @ 10e0b6ffb979f0a27fe58206512055133e67460a
# (2026-10-01, on standards' default branch — ancestry checked with
# `repos/hyperpolymath/standards/compare/main...<sha>` = "behind"). Pinned to an
# immutable commit, never `@main`: following main would let one push in
# standards change this repository's verdict with no review here.
#
# `secrets: inherit` is deliberately ABSENT. The reusable references only
# `secrets.HYPATIA_SCAN_PAT || secrets.GITHUB_TOKEN`; the built-in GITHUB_TOKEN
# is supplied to a reusable automatically, so `inherit` would hand it every
# repository and organisation secret for no functional gain (CWE-250). The
# estate's own D243 sweep dropped it for the same reason and verified the result
# on a positive control (hyperpolymath/zerostep#102, three green `scan /` jobs
# with no secrets passed).
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

# Estate guardrail: cancel superseded runs so re-pushes don't pile up queued
# runs across the estate. Safe here because this workflow only performs
# read-only checks with no publish or mutation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Exactly the set the reusable declares. `security-events: write` is required
# (write implies read): without it the caller is rejected at workflow startup and
# no job of the reusable is ever created — `continue-on-error` cannot rescue a
# job that was never created. It also lets the scanner read this repository's own
# Dependabot alerts. `pull-requests: write` was granted by the inline copy for
# its own comment step; the reusable posts no comment, so it is gone.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # No `name:` on this job, deliberately. A call reports as
  # "<caller job id> / <callee job name>", so this yields the estate-canonical
  # context `hypatia / Hypatia Neurosymbolic Analysis` — byte-identical to what
  # hyperpolymath/hypatia and hyperpolymath/zerostep emit. Adding a `name:` here
  # doubles it ("Hypatia Neurosymbolic Analysis / Hypatia Neurosymbolic
  # Analysis"), which matches no other consumer; a required context that names
  # the wrong string is the failure class behind standards#681.
  hypatia:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@1ded685afb366dededa9f372f82fb58cd45f3c7b
